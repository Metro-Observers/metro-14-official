- type: entity
  name: Чёрный
  parent: BaseSimpleMob
  id: BlackManMutantsdummy
  description: ....
  suffix: Спонсор
  components:
  - type: Sprite
    sprite: _Metro14/Mobs/black_humanoid_picture.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
  - type: Physics
  - type: MobState
  - type: Hands
  - type: ComplexInteraction
  - type: ContainerContainer
  - type: Appearance
  - type: MobThresholds
    thresholds:
      0: Alive
      230: Critical
      260: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 3.5
  - type: DamageStateVisuals
    states:
      Alive:
        Base: base
      Critical:
        Base: Black_Humonoid_sleeps
      Dead:
        Base: Black_Humonoid_Dead
  - type: GhostTakeoverAvailable
  - type: GhostRole
    makeSentient: true
    allowSpeech: false
    allowMovement: false
    name: Мутант чёрный
    description: Чёрные - это разумные, человекоподобные мутанты с чёрной блестящей кожей и крупными глазами, обладающие телепатическими способностями, которых люди считают врагами
    rules: Только для спонсоров. Вы свободный антагонист. Вам запрещено тотально убивать целую фракцию, только если на вас не напала вся фракция. Вы можете как объявить войну людям, так и наоборот, поддержать определенную группу или всё человечество целиком.
    raffle:
      settings: default
  - type: CombatMode
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Blunt: 17
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepThud
  - type: Body
    prototype: Human
  - type: SpecialAbilities
  - type: PassiveDamage  
    allowedStates:  
    - Alive
    damageCap: 300
    damage:  
      types:  
        Blunt: -0.2
        Slash: -0.1  
        Piercing: -0.2
