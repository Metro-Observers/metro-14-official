name: Publish

concurrency:
  group: publish
  cancel-in-progress: true

on:
  workflow_dispatch:
  # schedule:
   # - cron: '0 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Fail if we are attempting to run on the master branch
      if: ${{GITHUB.REF_NAME == 'master' && github.repository == 'space-wizards/space-station-14'}}
      run: exit 1

    - name: Install dependencies
      run: sudo apt-get install -y python3-paramiko python3-lxml

    - name: Checkout repository with private submodules
      uses: actions/checkout@v4.2.2
      with:
        token: ${{ secrets.PRIVATE_SUBMODULE_TOKEN }}
        submodules: false

    - name: Setup private submodules
      env:
        PAT: ${{ secrets.PRIVATE_SUBMODULE_TOKEN }}
      run: |
        git config --global url."https://x-access-token:$PAT@github.com".insteadOf "https://github.com"
        git submodule update --init --recursive
        echo "Submodules status:"
        git submodule status

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Get Engine Tag
      run: |
        if [ -d "RobustToolbox" ]; then
          cd RobustToolbox
          git fetch --depth=1
        fi

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      run: Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}
        FORK_ID: ${{ vars.FORK_ID }}

    # - name: Publish changelog (Discord)
