name: Build and Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

concurrency:
  group: build-and-package
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y unzip

    - name: Checkout repository with private submodules
      uses: actions/checkout@v4.2.2
      with:
        token: ${{ secrets.PRIVATE_SUBMODULE_TOKEN }}
        submodules: false

    - name: Setup private submodules
      env:
        PAT: ${{ secrets.PRIVATE_SUBMODULE_TOKEN }}
      run: |
        git config --global url."https://x-access-token:$PAT@github.com".insteadOf "https://github.com"
        git submodule update --init --recursive
        echo "Submodules status:"
        git submodule status

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Get Engine Tag
      run: |
        if [ -d "RobustToolbox" ]; then
          cd RobustToolbox
          git fetch --depth=1
        fi

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Extract version
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
        else
          echo "version=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
        fi

    - name: Package server
      run: |
        dotnet run --project Content.Packaging server \
          --platform win-x64 \
          --platform win-arm64 \
          --platform linux-x64 \
          --platform linux-arm64 \
          --platform osx-x64 \
          --platform osx-arm64

    - name: Create packages
      id: package
      run: |
        VERSION="${{ steps.version.outputs.version }}"

        for zip_file in ./release/SS14.Server_*.zip; do
          if [ ! -f "$zip_file" ]; then
            continue
          fi

          filename=$(basename "$zip_file")
          platform=$(echo "$filename" | sed 's/SS14.Server_//' | sed 's/.zip//')

          mkdir -p "temp_${platform}"
          unzip -q "$zip_file" -d "temp_${platform}"

          # Удаляем контент папки
          rm -rf "temp_${platform}/Content.Server" 2>/dev/null || true
          rm -rf "temp_${platform}/Content.Shared" 2>/dev/null || true
          rm -rf "temp_${platform}/Content.Client" 2>/dev/null || true

          # Удаляем все исходники
          find "temp_${platform}" -name "*.cs" -type f -delete 2>/dev/null || true
          find "temp_${platform}" -name "*.csproj" -type f -delete 2>/dev/null || true
          find "temp_${platform}" -name "*.sln" -type f -delete 2>/dev/null || true

          # Удаляем символы отладки
          find "temp_${platform}" -name "*.pdb" -type f -delete 2>/dev/null || true

          cd temp_${platform}
          zip -r "../ss14-server-${platform}-${VERSION}.zip" .
          tar -czf "../ss14-server-${platform}-${VERSION}.tar.gz" .
          cd ..

          rm -rf "temp_${platform}"
        done

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') && success()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ steps.version.outputs.version }}
        files: |
          ss14-server-*.zip
          ss14-server-*.tar.gz
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v4
      with:
        name: ss14-server-${{ steps.version.outputs.version }}
        path: |
          ss14-server-*.zip
          ss14-server-*.tar.gz
        retention-days: 30
        if-no-files-found: error
